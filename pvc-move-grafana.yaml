apiVersion: batch/v1
kind: Job
metadata: { name: pvc-move-grafana }
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: mover
        image: alpine:3.20
        command: ["sh","-c","apk add --no-cache rsync && rsync -aHAX --info=progress2 /src/ /dst/"]
        volumeMounts:
        - { name: src, mountPath: /src }
        - { name: dst, mountPath: /dst }
      volumes:
      - name: src
        persistentVolumeClaim: { claimName: grafana-data }        # old claim
      - name: dst
        persistentVolumeClaim: { claimName: grafana-data-gold }   # new claim

