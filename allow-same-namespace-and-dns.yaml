# allow-same-namespace-and-dns.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace-and-dns
  namespace: suite
spec:
  podSelector: {}                     # all pods in suite
  policyTypes: ["Ingress","Egress"]
  ingress:
  - from:
    - podSelector: {}                 # any pod in suite
  egress:
  # allow to same-namespace pods via their IPs/ClusterIP
  - to:
    - podSelector: {}                 # any pod in suite
  # allow DNS to kube-dns in kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

