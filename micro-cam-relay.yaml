apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-cam-relay
  namespace: suite
  labels: { app: micro-cam-relay }
spec:
  replicas: 1
  selector: { matchLabels: { app: micro-cam-relay } }
  template:
    metadata: { labels: { app: micro-cam-relay } }
    spec:
      nodeSelector:
        kubernetes.io/hostname: m3
      containers:
      - name: ffmpeg
        # jrottenberg multi-arch with busybox/curl; very stable on Pi
        image: jrottenberg/ffmpeg:6-alpine
        env:
          - name: SNAP_URL
            value: http://camera-uploader.suite.svc.cluster.local/latest.jpg
        command: ["/bin/sh","-c"]
        args:
          - |
            set -e
            echo "Waiting for $SNAP_URL..."
            until wget -q --spider "$SNAP_URL" 2>/dev/null || curl -fsI "$SNAP_URL" >/dev/null; do
              sleep 2
            done
            echo "Starting curl->ffmpeg pipe"
            # Continuously fetch the latest.jpg and stream to ffmpeg via stdin as MJPEG
            while true; do
              # fetch one frame; a short sleep controls FPS
              curl -fsSL "$SNAP_URL" || true
              sleep 0.2
            done | ffmpeg -hide_banner -nostats \
                 -re -f mjpeg -i - \
                 -vf "fps=5,format=yuv420p" \
                 -f rtsp rtsp://0.0.0.0:8554/porch
        ports:
          - name: rtsp
            containerPort: 8554
        readinessProbe:
          tcpSocket: { port: 8554 }
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: micro-cam-relay
  namespace: suite
spec:
  selector: { app: micro-cam-relay }
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: micro-cam-relay-tcp
  namespace: suite
spec:
  entryPoints: [rtsp]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: micro-cam-relay
          port: 8554
