# scrypted-egress.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scrypted-egress
  namespace: suite
spec:
  podSelector:
    matchLabels:
      app: scrypted
  policyTypes: ["Egress"]
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Mosquitto
    - to:
        - podSelector:
            matchLabels:
              app: mosquitto
      ports:
        - protocol: TCP
          port: 1883
    # MediaMTX (RTSP pull)
    - to:
        - podSelector:
            matchLabels:
              app: mediamtx
      ports:
        - protocol: TCP
          port: 8554

