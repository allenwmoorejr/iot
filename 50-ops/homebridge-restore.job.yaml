# save as homebridge-restore.job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  namespace: suite
  # Option A: fixed unique name per run
  name: homebridge-restore-20251107
  # Option B (alternative): let k8s append a random suffix
  # generateName: homebridge-restore-
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: alpine:3.20
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eux
              ls -la /backups || true
              LATEST=$(ls -1t /backups/homebridge-*.tgz 2>/dev/null | head -n1 || true)
              if [ -z "$LATEST" ]; then
                echo "ERROR: no backup tarball found in /backups"; exit 2
              fi
              echo "Restoring $LATEST"
              rm -rf /homebridge/*
              tar -xzf "$LATEST" -C /homebridge
              echo "Restore complete."
          volumeMounts:
            - { name: hb,  mountPath: /homebridge }
            - { name: bkp, mountPath: /backups }
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      volumes:
        - name: hb
          persistentVolumeClaim:
            # TODO: set your data PVC name
            claimName: homebridge-data
        - name: bkp
          persistentVolumeClaim:
            # TODO: set your backups PVC name
            claimName: homebridge-backups

