apiVersion: v1
kind: ConfigMap
metadata:
  name: magicmirror-theme
  namespace: suite
data:
  custom.css: |
    :root {
      --mm-accent: #76d7c4;
      --mm-fg: #eaeaea;
      --mm-dim: rgba(255,255,255,0.6);
      --mm-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      color: var(--mm-fg);
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .region.top_left .clock .time {
      font-size: 88px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .region.top_right .weather .current .temp {
      font-size: 46px;
      font-weight: 600;
    }
    .region.top_left .calendar .title,
    .region.top_left .calendar .event {
      font-size: 18px;
      opacity: 0.95;
    }
    .module {
      margin: 10px 18px;
      animation: fadeInUp 450ms ease 1;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translate3d(0, 12px, 0); }
      to   { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    /* Spotify styling */
    .MMM-NowPlayingOnSpotify .song,
    .MMM-NowPlayingOnSpotify .artist,
    .MMM-NowPlayingOnSpotify .album {
      font-size: 18px;
      line-height: 1.4;
    }
    .MMM-NowPlayingOnSpotify .cover {
      border-radius: 12px;
      box-shadow: var(--mm-shadow);
    }


