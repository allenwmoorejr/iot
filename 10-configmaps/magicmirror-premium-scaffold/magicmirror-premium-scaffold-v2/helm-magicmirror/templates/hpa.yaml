{{- $ns := default "suite" .Values.namespace -}}
{{- $hpa := .Values.hpa | default dict -}}
{{- if or (not (hasKey $hpa "enabled")) ($hpa.enabled) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: magicmirror-hpa
  namespace: {{ $ns }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: magicmirror-server
  minReplicas: {{ default 2 $hpa.minReplicas }}
  maxReplicas: {{ default 4 $hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ default 60 (get (default dict $hpa "cpu") "targetAverageUtilization") }}
{{- end }}

