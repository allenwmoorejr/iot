{{- $ns := default "suite" .Values.namespace -}}
{{- $svc := .Values.service | default dict -}}
apiVersion: v1
kind: Service
metadata:
  name: magicmirror-hostport
  namespace: {{ $ns }}
  labels:
    {{- include "mm.labels" . | nindent 4 }}
spec:
  type: {{ default "ClusterIP" $svc.type }}
  selector:
    app: magicmirror-server
  ports:
    - name: ui
      port: {{ default 8080 $svc.port }}
      targetPort: 8080

