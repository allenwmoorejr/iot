# storageclass-longhorn-nvme.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-nvme
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "3"           # or "3" if you have 3+ nodes with storage
  staleReplicaTimeout: "30"
  diskSelector: "nvme"            # <- matches the disk tag we set on m3

